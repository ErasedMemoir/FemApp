<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;">
    
    <title>Cantieri - FemApp</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/presenze.css">
    
    <script src="js/jspdf.min.js"></script>
    <script src="js/autotable.min.js"></script>
</head>
<body>
    <nav class="top-nav no-print">
        <button class="icon-btn" onclick="window.location.href='index.html'" aria-label="Torna alla Home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <span class="app-title">Cantieri</span>
        <button id="btnSettings" class="icon-btn" aria-label="Impostazioni">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </nav>

    <main class="app-content">
        <div class="month-navigator-container">
            <div class="month-navigator">
                <button id="btnPrevMonth" class="icon-btn" style="color: white;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <h2 id="currentMonthYear">Gennaio 2026</h2>
                <button id="btnNextMonth" class="icon-btn" style="color: white;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
        </div>

        <div class="table-container">
            <table id="presenzeTable">
                <thead><tr id="tableHeaderRow"></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <div class="bottom-action-bar no-print">
        <button id="btnCantieri" class="secondary-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Gestione
        </button>
        <button id="btnSmartAdd" class="primary-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            SmartAdd
        </button>
    </div>

    <div id="modalSmartAdd" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>SmartAdd</h3>
                <button class="close-modal" aria-label="Chiudi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <div class="modal-body">
                <label class="mb-05 block text-muted text-small font-600">1. Scegli Cantiere:</label>
                <select id="smartCantiereSelect" class="form-input"></select>
                <label class="mt-1 mb-05 block text-muted text-small font-600">2. Seleziona Operai:</label>
                <div id="smartWorkers" class="checkbox-group"></div>
                <div id="smartDateInputs" class="mt-1"></div>
                <button id="btnApplySmartAdd" class="primary-btn mt-15 w-100">Applica alle presenze</button>
            </div>
        </div>
    </div>

    <div id="modalCantieri" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Gestione Cantieri</h3>
                <button class="close-modal" aria-label="Chiudi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <div class="modal-body">
                <div class="flex-center-gap mb-1">
                    <input type="text" id="newCantiereInput" class="form-input" placeholder="Nome nuovo cantiere..." autocomplete="off">
                    <button id="btnAddCantiere" class="primary-btn">Aggiungi</button>
                </div>
                <ul id="cantieriList"></ul>
            </div>
        </div>
    </div>

    <div id="modalSettings" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Esporta Dati</h3>
                <button class="close-modal" aria-label="Chiudi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <div class="modal-body">
                <h4>Sicurezza Database</h4>
                <p class="text-muted text-small mb-1">Usa queste funzioni per salvare copie di backup sul telefono.</p>
                <button id="btnExportJSON" class="secondary-btn w-100 mb-1 flex-center-gap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Salva Backup (JSON)</button>
                <label for="importJSON" class="secondary-btn w-100 mb-2 flex-center-gap" style="cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Ripristina Dati (JSON)</label>
                <input type="file" id="importJSON" accept=".json" style="display:none;">
                <hr class="mb-2">
                <h4>Stampa Documento</h4>
                <p id="pdfErrorMsg" style="color: var(--danger); font-size: 14px; margin-bottom: 10px; display: none; text-align: center; font-weight: 600;">Seleziona almeno un mese.</p>
                <div id="pdfMonths" class="checkbox-group mb-15"></div>
                <button id="btnExportPDF" class="primary-btn w-100 flex-center-gap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Genera Report PDF</button>
            </div>
        </div>
    </div>
    
    <script src="js/presenze.js"></script>
</body>
</html>
