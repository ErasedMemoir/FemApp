<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;">
    
    <title>FemApp</title>
    <link rel="stylesheet" href="css/global.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icon-512.png">
</head>
<body>

    <main class="launcher-container">
        
        <header class="launcher-header">
            <h1 class="app-title">FemApp</h1>
            
            <button id="btnSettingsGlobal" class="icon-btn" aria-label="Impostazioni Globali">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <nav class="app-grid-centered">
            
            <button class="launcher-card-btn" onclick="window.location.href='presenze.html'" id="btnModuloPresenze">
                <div class="launcher-icon-wrap bg-green">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        <path d="M9 12h6"></path>
                        <path d="M9 16h6"></path>
                        <path d="M12 8h.01"></path>
                    </svg>
                </div>
                <div class="launcher-text-wrap text-center">
                    <span class="launcher-label">Cantieri</span>
                    <span class="launcher-desc">Presenze mensili e PDF</span>
                </div>
            </button>
            
            <button class="launcher-card-btn" onclick="window.location.href='preventivi.html'" id="btnModuloPreventivi">
                <div class="launcher-icon-wrap bg-blue">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
                <div class="launcher-text-wrap text-center">
                    <span class="launcher-label">Preventivi</span>
                    <span class="launcher-desc">Creazione schede e costi</span>
                </div>
            </button>

        </nav>

        <footer class="launcher-footer">
            <p class="text-muted text-small">FemApp <span id="app-version"></span></p>
        </footer>

    </main>

    <div id="modalSettingsGlobal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Impostazioni Globali</h3>
                <button id="btnCloseSettings" class="close-modal" aria-label="Chiudi">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-row mb-15">
                    <div class="setting-info">
                        <label class="block font-600">Tema Scuro</label>
                        <span class="text-muted text-small">Applica a tutta l'applicazione.</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="checkThemeGlobal">
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <hr class="mb-2">
                
                <h4>Svuota Memoria Interna</h4>
                <p class="text-muted text-small mb-1">Attenzione: cancella definitivamente tutti i cantieri, le presenze e i preventivi salvati.</p>
                <button id="btnResetAll" class="secondary-btn w-100 flex-center-gap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                    Svuota tutto il sistema
                </button>
            </div>
        </div>
    </div>

    <script src="js/home.js"></script>
</body>
</html>
